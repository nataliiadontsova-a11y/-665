<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clothing Bags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: sticky header with cart, 2x2 grid of bag cards, cart view with list + Add, full-screen green check */
:root{
  /* Light-only look: seafoam ground, navy ink, ultramarine actions, sun-yellow weight tags */
  --bg:#e6f2ef; --surface:#ffffff; --fg:#1d2840; --muted:#5a6680; --line:#c9dcd8;
  --accent:#3245d1; --accent-fg:#ffffff; --tag:#ffd84d; --tag-fg:#1d2840; --ok:#1fa45a;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.01em;background:none;border:0;color:var(--fg);cursor:pointer;padding:0}
.cartbtn{display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:999px;padding:9px 16px;font:700 .95rem var(--body);cursor:pointer}
.cartbtn .n{background:var(--accent-fg);color:var(--accent);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.15;margin:32px 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{transform:translateY(-2px);border-color:#9fb8f0}
.card:focus-visible,.cartbtn:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.card[aria-pressed="true"]{border-color:var(--accent)}
.card .ph{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;overflow:hidden}
.card img{max-height:100%;object-fit:contain}
.kg{position:absolute;box-shadow:0 2px 0 var(--fg);top:12px;left:12px;background:var(--tag);color:var(--tag-fg);font-family:var(--display);font-weight:700;font-size:1.1rem;padding:4px 12px;border-radius:8px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.row .lbl{font-weight:600}
.pick{font-weight:700;font-size:.9rem;padding:6px 12px;border-radius:999px;border:2px solid var(--accent);color:var(--accent);white-space:nowrap}
.card[aria-pressed="true"] .pick{background:var(--accent);color:var(--accent-fg)}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.item img{width:96px;height:96px;object-fit:contain}
.item .t{font-family:var(--display);font-weight:700;font-size:1.3rem}
.item .d{color:var(--muted);font-size:.9rem}
.rm{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font:600 .85rem var(--body);cursor:pointer}
.total{display:flex;justify-content:space-between;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;margin-top:20px;background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:16px;font:700 1.1rem var(--display);letter-spacing:.04em;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--muted)}
.link{background:none;border:0;color:var(--accent);font:700 1rem var(--body);cursor:pointer;padding:0;text-decoration:underline}
.done{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:16px;text-align:center}
.done svg{width:min(60vw,280px);height:auto}
.done circle{fill:var(--ok)}
.done path{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;animation:draw .5s .2s ease-out forwards}
.done .c{transform-origin:center;animation:pop .35s ease-out}
.done h2{font-family:var(--display);margin:20px 0 4px;font-size:1.5rem}
.done p{color:var(--muted);margin:0 0 20px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.done path{animation:none;stroke-dashoffset:0}.done .c{animation:none}.card{transition:none}}
@media (max-width:480px){.grid{gap:10px}.card{padding:10px}.kg{font-size:.95rem}.row{flex-direction:column;align-items:stretch}.pick{text-align:center}.item{grid-template-columns:64px minmax(0,1fr) auto;gap:10px}.item img{width:64px;height:64px}}
</style>

</head>
<body>
<header><div class="wrap">
  <button class="logo" id="home">Clothing Bags</button>
  <button class="cartbtn" id="toCart">Cart <span class="n" id="count">0</span></button>
</div></header>

<main class="wrap">
  <section id="shop">
    <h1>Choose a bag by weight</h1>
    <p class="sub">Tap a bag to add it to your cart. Tap again to remove it.</p>
    <div class="grid" id="grid"></div>
  </section>
  <section id="cart" hidden>
    <h1>Cart</h1>
    <p class="sub">Your selected bags</p>
    <div class="list" id="list"></div>
    <div class="total" id="total"></div>
    <button class="btn" id="add">ADD</button>
  </section>
</main>

<div class="done" id="done" hidden>
  <div>
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="c" cx="50" cy="50" r="48"/><path d="M28 52 L44 67 L73 36"/></svg>
    <h2>Added!</h2>
    <p id="doneTxt"></p>
    <button class="link" id="again">Back to bags</button>
  </div>
</div>

const BAGS=[
  {id:'5',kg:5,img:IMG_ONE,lbl:'1 bag'},
  {id:'10',kg:10,img:IMG_TWO,lbl:'2 bags'},
  {id:'15',kg:15,img:IMG_FIVE,lbl:'Bag set'},
  {id:'25',kg:25,img:IMG_FIVE,lbl:'Bag set'}
];
const sel=new Set();
const $=id=>document.getElementById(id);
function renderGrid(){
  $('grid').innerHTML=BAGS.map(b=>`<button class="card" data-id="${b.id}" aria-pressed="${sel.has(b.id)}">
    <span class="kg">${b.kg}kg</span>
    <span class="ph"><img src="${b.img}" alt="Clothing bag ${b.kg} kg"></span>
    <span class="row"><span class="lbl">${b.lbl} · ${b.kg} kg</span><span class="pick">${sel.has(b.id)?'✓ In cart':'Select'}</span></span>
  </button>`).join('');
  $('count').textContent=sel.size;
}
function renderCart(){
  const items=BAGS.filter(b=>sel.has(b.id));
  $('list').innerHTML=items.length?items.map(b=>`<div class="item">
    <img src="${b.img}" alt="">
    <div><div class="t">${b.kg}kg</div><div class="d">${b.lbl}</div></div>
    <button class="rm" data-rm="${b.id}">Remove</button></div>`).join('')
    :`<div class="empty">Your cart is empty. <button class="link" id="back">Choose bags</button></div>`;
  const sum=items.reduce((s,b)=>s+b.kg,0);
  $('total').innerHTML=items.length?`<span>Total: ${items.length} ${items.length===1?"bag":"bags"}</span><span>${sum} kg</span>`:'';
  $('total').hidden=!items.length;
  $('add').disabled=!items.length;
  $('count').textContent=sel.size;
}
function show(v){$('shop').hidden=v!=='shop';$('cart').hidden=v!=='cart';if(v==='cart')renderCart();else renderGrid();scrollTo(0,0)}
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const id=c.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);renderGrid()});
$('list').addEventListener('click',e=>{if(e.target.dataset.rm){sel.delete(e.target.dataset.rm);renderCart()}if(e.target.id==='back')show('shop')});
$('toCart').onclick=()=>show('cart');
$('home').onclick=()=>show('shop');
$('add').onclick=()=>{const items=BAGS.filter(b=>sel.has(b.id));
  $('doneTxt').textContent=items.map(b=>b.kg+'kg').join(', ')+' · total '+items.reduce((s,b)=>s+b.kg,0)+' kg';
  const d=$('done');d.hidden=false;d.querySelectorAll('path,.c').forEach(el=>{el.style.animation='none';el.offsetWidth;el.style.animation=''});};
$('again').onclick=()=>{$('done').hidden=true;sel.clear();show('shop')};
renderGrid();
</script>

</body>
</html>
